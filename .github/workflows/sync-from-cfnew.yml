name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:        # 手动触发
  schedule:
    - cron: '0 0 * * *'   # 每 6 小时检查一次

permissions:
  contents: write           # 需要推送提交

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 获取 cfnew 最新发布
        id: get_latest
        run: |
          echo "正在获取最新发布信息..."
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/byJoey/cfnew/releases/latest)

          VERSION=$(echo "$LATEST_RELEASE" | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "最新版本: $VERSION"

          ASSETS_URL=$(echo "$LATEST_RELEASE" | sed -n 's/.*"assets_url": "\([^"]*\)".*/\1/p')
          echo "正在获取文件列表..."
          ASSETS=$(curl -s "$ASSETS_URL")

          DOWNLOAD_URL=$(echo "$ASSETS" | grep -i "Pages\.zip" | grep -o '"browser_download_url": "[^"]*"' | sed 's/"browser_download_url": "\([^"]*\)"/\1/' | head -1)
          FILE_NAME="Pages.zip"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：未找到 Pages.zip 文件"
            echo "可用的文件列表："
            echo "$ASSETS" | grep -o '"name": "[^"]*"' | sed 's/"name": "\([^"]*\)"/  - \1/'
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "下载 URL: $DOWNLOAD_URL"

      - name: 检查当前版本
        id: check_version
        run: |
          if [ ! -f "VERSION.txt" ]; then
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "需要更新: '$CURRENT_VERSION' -> '$NEW_VERSION'"
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # 下载上游产物。解压后 _worker.js 是【上游纯净版】——这是构建的输入。
      # ------------------------------------------------------------------
      - name: 下载并解压上游产物
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到可下载的文件"; exit 1
          fi

          curl -L -o "$FILE_NAME" "$DOWNLOAD_URL"
          [ -f "$FILE_NAME" ] || { echo "错误：下载失败"; exit 1; }

          unzip -o "$FILE_NAME" -d .
          rm -f "$FILE_NAME"

          # 留一份纯净副本给契约校验用（提交前删除，不会进入仓库）
          cp _worker.js .upstream_worker.js
          echo "上游 _worker.js: $(wc -l < _worker.js) 行"

      # ------------------------------------------------------------------
      # 重新套用 UI。构建可移植且幂等：只按标记定位区域，不依赖行号。
      # ------------------------------------------------------------------
      - name: 重新套用 UI（构建）
        id: build_ui
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set +e
          node ui/build.mjs --input .upstream_worker.js --output _worker.js 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          {
            echo "## UI 构建"
            echo '```'
            cat /tmp/build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $STATUS

      # ------------------------------------------------------------------
      # 安全阀：上游若新增了 body.html 里没有的元素，这里失败并【拒绝提交】，
      # 仓库继续停留在上一个可用版本，绝不会推一个坏版本上去。
      # ------------------------------------------------------------------
      - name: 校验 UI 契约
        id: validate_ui
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set +e
          node ui/validate.mjs --upstream .upstream_worker.js --built _worker.js 2>&1 | tee /tmp/validate.log
          STATUS=${PIPESTATUS[0]}
          {
            echo "## UI 契约校验"
            echo '```'
            cat /tmp/validate.log
            echo '```'
            if [ $STATUS -ne 0 ]; then
              echo ""
              echo "> **本次未提交任何变更。** 仓库仍停留在上一个可用版本。"
              echo "> 按上面的提示修改 ui/src/body.html 后，手动重跑本工作流即可。"
            fi
          } >> $GITHUB_STEP_SUMMARY
          if [ $STATUS -ne 0 ]; then rm -f .upstream_worker.js; fi
          exit $STATUS

      # ------------------------------------------------------------------
      # 构建与校验都通过后才写版本号并提交。
      # ------------------------------------------------------------------
      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          rm -f .upstream_worker.js
          echo "${{ steps.get_latest.outputs.version }}" > VERSION.txt
          echo "版本记录已更新: ${{ steps.get_latest.outputs.version }}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }} (已重新套用 UI)"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        if: always()
        run: |
          {
            echo "## 同步结果"
            echo "- 最新版本: ${{ steps.get_latest.outputs.version }}"
            echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}"
            echo "- 需要更新: ${{ steps.check_version.outputs.need_update }}"
            echo "- UI 构建: ${{ steps.build_ui.outcome }}"
            echo "- UI 校验: ${{ steps.validate_ui.outcome }}"
          } >> $GITHUB_STEP_SUMMARY
